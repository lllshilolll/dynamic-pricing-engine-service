global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'telemetry-ingestion'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['telemetry-ingestion:8082']

  - job_name: 'pricing-engine'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['pricing-engine:8081']

  - job_name: 'admin-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['admin-service:8083']

  - job_name: 'telemetry-generator'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['telemetry-generator:8085']
