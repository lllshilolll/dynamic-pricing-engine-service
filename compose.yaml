services:
  redis:
    image: redis:7-alpine
    container_name: redis_service
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes #Включено сохранение данных
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7.0
    container_name: mongodb_service
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data: